[package]
name = "infinity-research"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
repository = { workspace = true }
license = "Apache-2.0"
description = "Bounded autonomous research workers on the native Infinity runtime."

[dependencies]
infinity-agent-core = { path = "../infinity-agent-core" }
infinity-provider-protocol = { path = "../infinity-provider-protocol", features = ["remote"] }
infinity-provider-rig = { path = "../infinity-provider-rig" }
rap-protocol = { path = "../rap-protocol" }
rig-core = { workspace = true, features = ["reqwest-rustls"] }
async-trait = { workspace = true }
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "process", "io-util", "signal", "time", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
