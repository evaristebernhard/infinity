name: Autonomous research

on:
  push:
    branches: [main, feat/autonomous-kaggle-research]
    paths: ['research/**', 'crates/infinity-research/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/research.yml']
  pull_request:
    paths: ['research/**', 'crates/infinity-research/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/research.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './research[filament]'
      - run: python -m unittest discover -s research/tests -v
      - run: python -m infinity_research.cli smoke --output "$RUNNER_TEMP/research-smoke"
      - run: python research/examples/squares-in-squares/exact_certificate_demo.py --self-test
      - run: python research/examples/squares-in-squares/exact_certificate_demo.py > "$RUNNER_TEMP/square-certificates.json"
  macos-trusted-fixture:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: research
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/tests -p test_evaluate.py -v
      - run: python -m unittest discover -s research/tests -p test_campaign.py -v
      - run: python -m infinity_research.cli smoke --output "$RUNNER_TEMP/research-smoke"
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p infinity-research --all-targets --locked -- -D warnings
      - run: cargo test -p infinity-research --locked
